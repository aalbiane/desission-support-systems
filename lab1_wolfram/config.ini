; Файл конфигурации программы (содержит личный API-ключ, не публикуйте его).
[wolfram]
app_id = J54QPHP6QQ
base_url = https://api.wolframalpha.com/v2/query

[network]
; тайм-аут запроса в секундах, число повторов и пауза между запросами
timeout = 30
retries = 3
pause = 1.0

[output]
results_dir = results
log_file = logs/wolfram.log
