; Пример файла конфигурации. Скопируйте его в config.ini и впишите свой AppID.
[wolfram]
app_id = YOUR_APP_ID
base_url = https://api.wolframalpha.com/v2/query

[network]
; тайм-аут запроса в секундах, число повторов и пауза между запросами
timeout = 30
retries = 3
pause = 1.0

[output]
results_dir = results
log_file = logs/wolfram.log
